name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    # GitHub-hosted: free for a public repo, and no fork PR runs code on our own machines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest ruff
      - run: ruff check --select E9,F skills/boss skills/hand-to-boss
        continue-on-error: true     # one known F841 in frontier.py; drop this once it is fixed
      - run: python3 -m pytest -q skills
        env:
          PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
